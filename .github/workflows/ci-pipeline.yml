name: Node.js CI Pipeline

# 1. THE TRIGGER: run on every push to main, and on every PR targeting main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# 2. THE RUNNER: GitHub provisions a free, temporary Linux server for us
jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # 3. THE STEPS: The exact terminal commands the server must execute
    steps:
      # Step A: Download our code from the repository onto the temporary server
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step B: Install the Node.js version our app runs on
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Step C: Install dependencies exactly as locked in package-lock.json
      - name: Install Dependencies
        run: npm ci

      # Step D: Catch type errors before running tests
      - name: Type Check
        run: npm run typecheck

      # Step E: Run tests and enforce the coverage threshold
      - name: Run Tests
        run: npm run test:coverage

      # Step F: The Ultimate Test - Does our Dockerfile actually compile?
      - name: Test Docker Build
        run: docker build -t test-api-image .